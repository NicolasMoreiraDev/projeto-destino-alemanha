<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Dashboard - Destino Alemanha</title>
</head>
<body>
    <header>
        <h1>Dashboard da Mudança: Destino Alemanha</h1>
    </header>

    <main>
        <div class="task-adder">
            <input type="text" id="task-input" placeholder="Digite uma nova tarefa (ex: tirar o passaporte)">
            <button id="add-task-btn">Adicionar</button>
        </div>

        <ul id="task-list">
            </ul>

        <section id="costs">
            <h2>Calculadora de Custos</h2>
            </section>
    </main>

    <footer>
        <p>Um projeto de <a href="https://github.com/NicolasMoreiraDev" target="_blank">Nicolas Pantaleão</a>.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
